      - click: "[data-day-col] >> nth=2"
        at: { x: 0.5, y: 0.4166 }
      - assert_js: |
          const v = document.querySelector('input[type="datetime-local"]').value;
          return /T10:(00|30)$/.test(v);
        why: clicked slot time was ignored in favour of a fixed default

