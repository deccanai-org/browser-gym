# Executable regression suite — maps 1:1 to docs/qa/QA_REPORT_2026-08-06.md
# Each check is run by tools.qa_pipeline.runner against a live mock UI.

apps:
  shopgym: { folder: xmazon_mock, port: 5201, path: / }
  valuemart: { folder: xbay_mock, port: 5202, path: / }
  shopmail: { folder: xmail_mock, port: 5203, path: / }
  gymcal: { folder: xoogle_calendar_mock, port: 5204, path: / }
  gymeats: { folder: xber_eats_mock, port: 5205, path: / }

