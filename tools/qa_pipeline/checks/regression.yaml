  # Reported defects #43-54
  - id: GC-12
    app: gymcal
    severity: critical
    title: Calendar shows the real current month
    kind: browser
    steps:
      - goto: /
      - assert_js: |
          const want = new Date().toLocaleString('en-US', { month: 'long', year: 'numeric' });
          const h = document.querySelector('h2.text-xl');
          return !!h && h.innerText.trim() === want;
        why: header month/year is not today's

  - id: GC-13
    app: gymcal
    severity: critical
    title: Create defaults to today, not a stale seed date in UTC
    kind: browser
    steps:
      - goto: /
      - click: button:has-text("Create")
      - assert_js: |
          const v = document.querySelector('input[type="datetime-local"]').value;
          const d = new Date();
          const p = (n) => String(n).padStart(2, '0');
          const today = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
          return v.startsWith(today);
        why: new event does not default to the current date

  - id: GC-24
    app: gymcal
