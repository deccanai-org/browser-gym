<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>xber Eats — {% block title %}Restaurants{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col antialiased">

  {% include "_appbar.html" %}

  <!-- FOOD HEADER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-4">
      <a href="/food" class="flex items-center gap-2" data-test-id="food-logo">
        <span class="text-2xl" aria-hidden="true">🍔</span>
        <span class="font-extrabold text-xl tracking-tight">xber <span class="text-orange-600">Eats</span></span>
      </a>
      <nav class="flex-1" aria-label="Food">
        <a href="/food" data-test-id="food-nav-restaurants" class="text-sm text-slate-600 hover:text-orange-600 px-2 py-1">Restaurants</a>
      </nav>
      <a href="/food/cart" data-test-id="link-food-cart" role="button"
         class="inline-flex items-center gap-2 hover:bg-slate-100 px-3 py-2 rounded relative">
        <span class="text-2xl" aria-hidden="true">🛍️</span>
        <span class="font-semibold text-sm">Food cart</span>
        {% if food and food.cart.count() > 0 %}
        <span data-test-id="food-cart-count"
              class="bg-orange-500 text-white text-xs font-bold px-1.5 rounded-full min-w-[20px] text-center">{{ food.cart.count() }}</span>
        {% endif %}
      </a>
    </div>
  </header>

  {% include "_taskbanner.html" %}

  <main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-slate-900 text-slate-400 mt-12 text-xs">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <span>© 2026 xber Eats — all data is fake.</span>
      <a href="/" class="hover:text-white" data-test-id="food-footer-shop">← Back to Shop</a>
    </div>
  </footer>
</body>
</html>
