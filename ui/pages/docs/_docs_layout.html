<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ShopGym Docs — {% block title %}Docs{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col antialiased">

  {% include "_appbar.html" %}

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-4">
      <a href="/docs" class="flex items-center gap-2" data-test-id="docs-logo">
        <span class="text-2xl" aria-hidden="true">📄</span>
        <span class="font-extrabold text-xl tracking-tight">Shop<span class="text-teal-600">Docs</span></span>
      </a>
      <nav class="flex items-center gap-2 text-sm">
        <a href="/docs" data-test-id="docs-nav-docs"
           class="px-2 py-1 rounded {% if folder|default('docs') != 'trash' %}bg-teal-50 text-teal-800 font-semibold{% else %}text-slate-600 hover:bg-slate-100{% endif %}">Docs</a>
        <a href="/docs?folder=trash" data-test-id="docs-nav-trash"
           class="px-2 py-1 rounded {% if folder|default('docs') == 'trash' %}bg-teal-50 text-teal-800 font-semibold{% else %}text-slate-600 hover:bg-slate-100{% endif %}">Trash</a>
      </nav>
      <span class="flex-1"></span>
      <a href="/docs/new" data-test-id="btn-new-doc" role="button"
         class="bg-teal-600 hover:bg-teal-500 text-white px-4 py-2 rounded-md text-sm font-semibold inline-flex items-center gap-1">
        <span aria-hidden="true">＋</span> New doc
      </a>
    </div>
  </header>

  {% include "_taskbanner.html" %}

  <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-slate-900 text-slate-400 mt-12 text-xs">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <span>© 2026 ShopGym Docs — all data is fake.</span>
      <a href="/" class="hover:text-white" data-test-id="docs-footer-shop">← Back to Shop</a>
    </div>
  </footer>
</body>
</html>
