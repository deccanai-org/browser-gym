<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>xmail — {% block title %}Inbox{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col antialiased">

  {% include "_appbar.html" %}

  <!-- MAIL HEADER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-4">
      <a href="/mail" class="flex items-center gap-2" data-test-id="mail-logo">
        <span class="text-2xl" aria-hidden="true">✉️</span>
        <span class="font-extrabold text-xl tracking-tight">xmail</span>
      </a>

      <form action="/mail" method="get" class="flex-1 max-w-xl flex" data-test-id="form-mail-search" role="search">
        <input name="q" value="{{ q or '' }}" placeholder="Search mail"
               x-data x-init="$el.value = '{{ q or '' }}'"
               data-test-id="input-mail-search" aria-label="Search mail" autocomplete="off"
               class="flex-1 border border-slate-300 rounded-l-md px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" />
        <button type="submit" data-test-id="btn-mail-search" aria-label="Search mail"
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-r-md text-sm font-semibold">Search</button>
      </form>

      <a href="/mail/compose" data-test-id="btn-compose" role="button"
         class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-md text-sm font-semibold inline-flex items-center gap-1">
        <span aria-hidden="true">✏️</span> Compose
      </a>
      <span class="text-sm text-slate-500 hidden md:block" data-test-id="mail-account">{{ mail.account_email if mail else '' }}</span>
    </div>
  </header>

  {% include "_taskbanner.html" %}

  <main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-slate-900 text-slate-400 mt-12 text-xs">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <span>© 2026 xmail — all data is fake.</span>
      <a href="/" class="hover:text-white" data-test-id="mail-footer-shop">← Back to Shop</a>
    </div>
  </footer>
</body>
</html>
