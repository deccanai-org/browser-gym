{% extends "calendar/_calendar_layout.html" %}
{% block title %}Edit event{% endblock %}
{% block content %}

<a href="/calendar" data-test-id="link-back-to-agenda" class="text-sm text-blue-600 hover:underline">← Back to agenda</a>

{% if not event %}
  <div class="mt-3 text-slate-500" data-test-id="edit-not-found">That event no longer exists.</div>
{% else %}
<form action="/calendar/update" method="post"
      class="bg-white rounded-lg border border-slate-200 shadow-sm max-w-xl mt-3" data-test-id="form-edit-event">
  <div class="px-5 py-3 border-b border-slate-200 font-bold">Edit calendar event</div>
  <input type="hidden" name="event_id" value="{{ event.id }}" data-test-id="input-edit-event-id" />
  <div class="px-5 py-4 space-y-3">
    <label class="block">
      <span class="text-xs text-slate-500">Title</span>
      <input name="title" required value="{{ event.title }}"
             data-test-id="input-edit-title" aria-label="Event title"
             class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
    </label>
    <div class="text-xs text-slate-500 font-mono" data-test-id="event-id-display">
      Event ID: {{ event.id }}
    </div>
    <div class="text-xs text-slate-500">{{ event.day_label }}</div>
    <div class="flex gap-3">
      <label class="block flex-1">
        <span class="text-xs text-slate-500">Start</span>
        <input name="start" value="{{ event.start }}" data-test-id="input-edit-start" aria-label="Start time"
               class="w-full border border-slate-300 rounded px-3 py-2 text-sm" />
      </label>
      <label class="block flex-1">
        <span class="text-xs text-slate-500">End</span>
        <input name="end" value="{{ event.end }}" data-test-id="input-edit-end" aria-label="End time"
               class="w-full border border-slate-300 rounded px-3 py-2 text-sm" />
      </label>
    </div>
  </div>
  <div class="px-5 py-3 border-t border-slate-200 flex gap-2">
    <button type="submit" data-test-id="btn-update-event"
            class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-md text-sm font-semibold">Save changes</button>
    <a href="/calendar" data-test-id="btn-cancel-edit" class="px-5 py-2 text-sm text-slate-500 hover:text-slate-700">Cancel</a>
  </div>
</form>

<form action="/calendar/delete" method="post" class="max-w-xl mt-3" data-test-id="form-delete-event">
  <input type="hidden" name="event_id" value="{{ event.id }}" />
  <button type="submit" data-test-id="btn-delete-event"
          class="text-sm text-red-600 hover:text-red-700 hover:underline">Delete this event</button>
</form>
{% endif %}

{% endblock %}
