<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>xoogle Calendar — {% block title %}Agenda{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col antialiased">

  {% include "_appbar.html" %}

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-4">
      <a href="/calendar" class="flex items-center gap-2" data-test-id="calendar-logo">
        <span class="text-2xl" aria-hidden="true">📅</span>
        <span class="font-extrabold text-xl tracking-tight">xoogle Calendar</span>
      </a>
      <span class="flex-1"></span>
      <a href="/calendar/new" data-test-id="btn-new-event" role="button"
         class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-md text-sm font-semibold inline-flex items-center gap-1">
        <span aria-hidden="true">＋</span> New event
      </a>
    </div>
  </header>

  {% include "_taskbanner.html" %}

  <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-slate-900 text-slate-400 mt-12 text-xs">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <span>© 2026 xoogle Calendar — all data is fake.</span>
      <a href="/" class="hover:text-white" data-test-id="calendar-footer-shop">← Back to Shop</a>
    </div>
  </footer>
</body>
</html>
