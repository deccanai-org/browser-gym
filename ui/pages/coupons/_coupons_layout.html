<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ShopGym Coupons — {% block title %}Coupons{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col antialiased">

  {% include "_appbar.html" %}

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-4">
      <a href="/coupons" class="flex items-center gap-2" data-test-id="coupons-logo">
        <span class="text-2xl" aria-hidden="true">🏷️</span>
        <span class="font-extrabold text-xl tracking-tight">Shop<span class="text-rose-600">Coupons</span></span>
      </a>
      <nav class="flex items-center gap-2 text-sm">
        <a href="/coupons" data-test-id="coupons-nav-browse"
           class="px-2 py-1 rounded text-slate-600 hover:bg-slate-100">Browse</a>
        <a href="/coupons/wallet" data-test-id="coupons-nav-wallet"
           class="px-2 py-1 rounded text-slate-600 hover:bg-slate-100">Wallet</a>
      </nav>
      <span class="flex-1"></span>
      <span class="text-xs text-slate-500 hidden sm:inline" data-test-id="coupons-hint">
        Clip codes here; redeem at Shop / ValueMart / Food checkout.
      </span>
    </div>
  </header>

  {% include "_taskbanner.html" %}

  <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-slate-900 text-slate-400 mt-12 text-xs">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <span>© 2026 ShopGym Coupons — merchant labels are informational only.</span>
      <a href="/" class="hover:text-white" data-test-id="coupons-footer-shop">← Back to Shop</a>
    </div>
  </footer>
</body>
</html>
